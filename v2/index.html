<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
<header>
  <h1>ALMANAKK <span class="v2">2</span></h1>
  <nav>
    <!-- THE ARROWS COME BACK ON A WIDE SCREEN (Alan, 14.09). A phone steps by
         swiping and by its edges, and the four view buttons went with the
         arrows in September because the calendar already said what they said.
         A desk has no edges to tap and no thumb to swipe with, and the room to
         spare, so they return there and nowhere else. -->
    <button id="prev" class="wideonly" aria-label="Forrige">‹</button>
    <strong id="period-label"></strong>
    <button id="next" class="wideonly" aria-label="Neste">›</button>
  </nav>
  <div class="spacer"></div>
  <nav>
    <!-- the year leaves the middle so the month can be dead centre, and takes
         the space between it and the controls (Alan, 14.09) -->
    <span id="period-year"></span>
    <!-- ONE BUTTON, AND IT NAMES WHERE IT TAKES YOU (Alan, 14.09): "week" in the
         month, "month" in the week, and nothing at all in the year. It sits with
         the other controls rather than beside the title. -->
    <span id="views" class="wideonly"><button></button></span>
    <button id="signin" hidden>Logg inn med Google</button>
    <!-- ONE CONTROL IN THE HEADER (Alan, 13.09). The month's own name opens the
         year, a day opens its week, a title closes back up and a swipe steps
         sideways — so the four view buttons and the two arrows were saying
         again what the calendar already says. Everything you set once and
         leave lives behind the dots. -->
    <details id="more">
      <summary title="Mer" aria-label="Mer">⋯</summary>
      <div id="more-list">
        <button id="tour-chip" hidden title="Legg wg-turnékalenderne over som bånd">wg — turnékalendere</button>
        <button id="print" title="Skriv ut A4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg><span class="btxt">Skriv ut</span></button>
        <button id="lang-chip" title="Norsk / English"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c3.5 3.5 3.5 16.5 0 20-3.5-3.5-3.5-16.5 0-20z"/></svg> <span class="btxt">Språk</span></button>
        <details id="cal-picker" hidden>
          <summary>Kalendere</summary>
          <div id="cal-list"></div>
        </details>
      </div>
    </details>
  </nav>
</header>
<div id="banner" hidden></div>
<main id="app"></main>
<div id="toast" hidden></div>
<!-- null here = Google sign-in in the browser (github.io). publiser.py flips it to
     '/api/gcal' in the Cloudflare build, where the key lives on the server. -->

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
