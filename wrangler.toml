# Almanakk v2 on Cloudflare Pages. Deploy with `python3 publiser.py`, never a
# bare `wrangler pages deploy` — the script builds dist/ so nothing personal
# (Front/, inventory/) can ever be uploaded, and this file carries the bindings.
name = "almanakk-v2"
compatibility_date = "2026-09-09"
pages_build_output_dir = "dist"

# Holds Google's refresh token and a short-lived access token. Bind a namespace
# called ALMANAKK_STATE and paste its id here (publiser.py --lag-kv gjør det).
[[kv_namespaces]]
binding = "KV"
id = "8935882923314b36a43688fa05509f30"

# Pages keeps PREVIEW and PRODUCTION apart: bindings above reach production
# only. Without this the preview lane had no KV and no secrets, so its function
# could not mint a Google token and Alan's phone showed an empty calendar
# (12.09.2026). Same namespace on purpose — one refresh token, both lanes.
[env.preview]
[[env.preview.kv_namespaces]]
binding = "KV"
id = "8935882923314b36a43688fa05509f30"
